<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="index,follow">
    <meta name="googlebot" content="index,follow">
    <title>lmnt.</title>
    <link rel="icon" type="image/webp" href="/images/avatar.webp"/>
    <meta name="theme-color" content="#fff8f2">
    <link href="/styles/base.css" rel="stylesheet"/>
    <link id="lmnt-theme" href="/lib/theme/pastel-90s.css" rel="stylesheet"/>
    <script>
      /* restore the saved theme before first paint; lmnt-theme-switcher owns it from there */
      try {
        var savedTheme = localStorage.getItem('lmnt-theme')
        if (savedTheme && /^[a-z0-9-]+$/.test(savedTheme)) {
          document.getElementById('lmnt-theme').href = '/lib/theme/' + savedTheme + '.css'
        }
      } catch (e) {}
    </script>
    <script src="src/index.ts" type="module"></script>
</head>
<body>
<lmnt-veil>
    <lmnt-header>
        <lmnt-avatar-header src="/images/avatar.webp" link="/">
            <cursor-animation>lmnt.</cursor-animation>
        </lmnt-avatar-header>
        <lmnt-theme-switcher></lmnt-theme-switcher>
    </lmnt-header>
    <lmnt-content>
        <lmnt-photo-grid columns="3">
            <lmnt-photo src="/images/photos/photo-1.svg" full="/images/photos/photo-1-full.svg"
                        alt="test card one, orange, four by three" caption="one" loading="eager"></lmnt-photo>
            <lmnt-photo src="/images/photos/photo-2.svg" alt="test card two, green, square"
                        caption="two" loading="eager"></lmnt-photo>
            <lmnt-photo src="/images/photos/photo-3.svg" alt="test card three, blue, three by two"
                        caption="three" loading="eager"></lmnt-photo>
            <lmnt-photo src="/images/photos/photo-4.svg" alt="test card four, violet, portrait"></lmnt-photo>
            <lmnt-photo src="/images/photos/photo-5.svg" alt="test card five, coral, wide"
                        caption="five"></lmnt-photo>
            <lmnt-photo src="/images/photos/photo-6.svg" alt="test card six, cyan, square"
                        caption="six"></lmnt-photo>
        </lmnt-photo-grid>
    </lmnt-content>
    <lmnt-footer>
        <lmnt-i-smtxt>
            built with
            <lmnt-img-link link="https://lit.dev/" src="/svg/lit.svg" alt="lit" new></lmnt-img-link>
        </lmnt-i-smtxt>
    </lmnt-footer>
</lmnt-veil>
</body>
</html>
